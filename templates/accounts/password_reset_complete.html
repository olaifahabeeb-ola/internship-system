{% extends "base.html" %}
{% block title %}Password Reset Complete — InternTrack{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-sm-10 col-md-6 col-lg-5">
    <div class="card shadow-sm border-0 rounded-3">
      <div class="card-body p-4 text-center">
        <div class="d-inline-flex align-items-center justify-content-center
                    rounded-circle bg-success text-white mb-3"
             style="width:64px;height:64px;font-size:1.8rem;">
          <i class="bi bi-check-circle-fill"></i>
        </div>
        <h5 class="fw-bold mb-2">Password reset</h5>
        <p class="text-muted small mb-4">
          Your password has been changed successfully. You can now sign in with your new password.
        </p>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign in
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
